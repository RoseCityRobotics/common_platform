{% extends "!layout.html" %}

{% block extrahead %}
{{ super() }}
<style>
    .custom-footer {
        border-top: 1px solid #e1e4e8;
        padding-top: 20px;
        margin-top: 20px;
    }
    .custom-footer a {
        color: #2980b9;
        text-decoration: none;
    }
    .custom-footer a:hover {
        color: ligthen(#2980b9, 10%);
    }
    /* Ensure consistent line height for toctree titles */
    .toctree-wrapper li a,
    .toctree-l1 > a,
    .toctree-l2 > a {
        min-height: 3em;
        line-height: 1.5em;
        display: inline-block;
    }
</style>
{% endblock %}

{% block content %}
{{ super() }}
<div class="custom-footer">
    Open source project <a href="https://github.com/RoseCityRobotics/common_platform/blob/main/LICENSE" target="_blank">View License</a>
</div>
{% endblock %}
